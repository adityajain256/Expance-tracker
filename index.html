  <style>
    .lightBody{
    display: flex;
    flex-direction: column;
    background-color: bisque;
    color: black;
    margin: 0;
    padding: 0;
}
.darkBody{
    background-color: grey;
    color: rgb(255, 255, 255);
}
#hConatainer{
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center; 
    padding: 10px;
}

.light{

    background-color: rgb(61, 1, 1);
    color: azure;
    border: 2px solid grey;
    border-radius: 6px;
    padding: 4px;
    box-shadow: 5px 8px 10px 1px black;

}

.dark{
    background-color: wheat;
    color: black;
    border: 2px solid grey;
    border-radius: 6px;
    padding: 4px;
    /* box-shadow: 5px 8px 10px 1px rgb(255, 114, 114); */
}

.month{
    margin: 12px;
    margin-left: 88px;
    border-style: none;
    font-size: larger;
}

#mContainer{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 12px;
    margin-top: 2rem;
}



main{
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    /* width: 100vw; */
    height: 9rem;
    margin-top: 4rem;

}

#date{
    width: 30vw;
    margin-left: 7rem;
}

#amount{
    width: 30vw;

}

#Description{
    width: 40vw;
}

.input{
    border-style: none;
    padding: 10px;
    font-size: 17px;
}

.enter{
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    margin-top: 5rem;

}

.enterbtn{
    font-size: 23px;
    padding: 12px;
}

#history{

    width: 100vw;
    height: 50px;

}

.sum{
    position: relative;
    margin: 10px;
    background-color: black;
    padding: 10px;
}

#sumo{
    height: 10px;
    background-color: black;
}

/* Mobile display styles */
@media (max-width: 768px) {
    .lightBody, .darkBody {
        flex-direction: column;
        padding: 10px;
    }

    #hConatainer {
        flex-direction: column;
        align-items: flex-start;
        padding: 5px;
    }

    .light, .dark {
        font-size: 14px;
        padding: 6px;
        box-shadow: none;
    }

    .month {
        margin: 8px;
        margin-left: 20px;
        font-size: medium;
    }

    #mContainer {
        margin: 8px;
        margin-top: 1rem;
    }

    main {
        flex-direction: column;
        height: auto;
        margin-top: 2rem;
    }

    #date, #amount, #Description {
        width: 90%;
        margin: 5px auto;
    }

    .input {
        font-size: 15px;
        padding: 8px;
    }

    .enter {
        margin-top: 2rem;
        padding: 8px;
    }

    .enterbtn {
        font-size: 18px;
        padding: 10px;
    }

    #history {
        height: auto;
        padding: 10px;
    }

    .sum {
        margin: 5px;
        padding: 8px;
    }

    #sumo {
        height: 5px;
    }
}


  </style>

        <main>

    <script>
        // theme changing button
let theme = document.querySelector("#theme");
let body = document.querySelector('body');

theme.addEventListener('click',()=>{
    theme.classList.toggle("dark");
    body.classList.toggle("darkBody");
});



// creating global variable 
let arr = []
let newArr;
//try to showcase reale time date and month in month section 
let monthH = document.querySelector("#h");
let my = new Date()
monthH.innerText = my;

// let month = document.querySelector("#month");
let date = document.querySelector("#inpDate");
let spent = document.querySelector("#inpAmount");
let description = document.querySelector('#inpDes');
let enter = document.querySelector("#enterBtn");
let mainbody = document.querySelector('main');
let newDiv;
let history = document.querySelector('#history');

enter.addEventListener("click", ()=>{

    // creating small name variable for input values 
    let dateV = date.value;
    let spentV = spent.value;
    let desV = description.value;
    let userExpense;
    let data;
    if(dateV == ''){
        alert("Enter date");
    }
    else if(spentV == ''){
        alert("Enter amount");
    }
    else if (desV == ''){
        alert("Enter some description");
    }
    // if every thing is filled then 
    else{

        // storing data inside local storage 
        userExpense = { "date": dateV, "amount": spentV, "description": desV};
        localStorage.setItem('userExpense', JSON.stringify(userExpense));
        data = JSON.parse(localStorage.getItem('userExpense'));

        // push data inside an array 
        arr.push(data); 
        newDiv = document.createElement('div');
        newDiv.style.display = "flex"
        newDiv.style.flexDirection = 'row'
    
        newDiv.innerHTML = `
            <div id="date">
                <h1>${data.date}</h1>
              </div>
              <div id="amount">
                <h1>${data.amount}</h1>
              </div>
              <div id="Description">
                <h1>${data.description}</h1>               
            </div>` 
    
        history.appendChild(newDiv);

        if(enter){
            spent.value = ''
            description.value = ''
        }
    }
    // saving global arr inside an newArr 
    localStorage.setItem('arr', JSON.stringify(arr));
    newArr = JSON.parse(localStorage.getItem('arr'));
    console.log(newArr);
    
})

// Show saved expenses when the page loads
window.addEventListener('DOMContentLoaded', () => {
    let savedArr = JSON.parse(localStorage.getItem('arr')) || [];

    savedArr.forEach((data) => {
        let newDiv = document.createElement('div');
        newDiv.style.display = "flex";
        newDiv.style.flexDirection = "row";

        newDiv.innerHTML = `

            </div>

        `;
